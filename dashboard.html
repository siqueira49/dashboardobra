<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal da Transparência Obra</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg:#0e0f11;--surface:#16181c;--surface2:#1e2026;--border:#2a2d35;
  --accent:#f0c040;--accent2:#e05c3a;--green:#3ddc84;--red:#e05c3a;
  --blue:#5b8def;--purple:#a78bfa;
  --text:#e8eaf0;--muted:#6b7280;
  --font-d:'Bebas Neue',sans-serif;--font-m:'DM Mono',monospace;--font-b:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);min-height:100vh;overflow-x:hidden}

header{padding:28px 40px 20px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--border);gap:20px;flex-wrap:wrap}
.eyebrow{font-family:var(--font-m);font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
h1{font-family:var(--font-d);font-size:clamp(32px,5vw,60px);color:var(--accent);line-height:1}
.btn-upload{background:var(--accent);color:#000;border:none;padding:10px 22px;font-family:var(--font-m);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:.2s;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.btn-upload:hover{background:#ffd966;transform:translateY(-1px)}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.kpi{background:var(--surface);padding:24px 28px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent)}
.kpi.red::before{background:var(--red)}.kpi.green::before{background:var(--green)}.kpi.blue::before{background:var(--blue)}
.kpi-lbl{font-family:var(--font-m);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.kpi-val{font-family:var(--font-d);font-size:clamp(26px,3vw,40px);line-height:1}
.kpi-val.g{color:var(--green)}.kpi-val.r{color:var(--red)}.kpi-val.y{color:var(--accent)}
.kpi-sub{font-family:var(--font-m);font-size:11px;color:var(--muted);margin-top:5px}
.kpi-ico{position:absolute;bottom:14px;right:18px;font-size:32px;opacity:.07}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.panel{background:var(--surface);padding:26px 30px}
.panel.full{grid-column:1/-1}
.panel.span2{grid-column:span 2}
.ptitle{font-family:var(--font-d);font-size:20px;letter-spacing:.04em;color:var(--accent);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.ptitle .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
.ptitle.red{color:var(--red)}.ptitle.red .dot{background:var(--red)}
.ptitle.green{color:var(--green)}.ptitle.green .dot{background:var(--green)}
.ptitle.blue{color:var(--blue)}.ptitle.blue .dot{background:var(--blue)}
.ptitle.purple{color:var(--purple)}.ptitle.purple .dot{background:var(--purple)}

.insumos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.insumo-card{background:var(--surface2);border-radius:3px;padding:16px 14px;border-left:3px solid var(--accent)}
.ins-icon{font-size:22px;margin-bottom:8px;display:block}
.ins-name{font-family:var(--font-m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ins-qty{font-family:var(--font-d);font-size:28px;line-height:1;color:var(--text)}
.ins-unit{font-family:var(--font-m);font-size:10px;color:var(--muted);margin-top:2px}
.ins-total{font-family:var(--font-m);font-size:11px;color:var(--accent);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.ins-compras{font-family:var(--font-m);font-size:10px;color:var(--muted);margin-top:3px}

.mao-table{width:100%;border-collapse:collapse}
.mao-table td,.mao-table th{padding:9px 12px;font-family:var(--font-m);font-size:12px;border-bottom:1px solid var(--border)}
.mao-table th{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.mao-table tr:hover td{background:var(--surface2)}
.dia-chip{background:var(--blue);color:#fff;border-radius:2px;padding:2px 8px;font-size:11px;font-weight:500}

.bar-row{display:grid;grid-template-columns:110px 1fr 80px;align-items:center;gap:10px;margin-bottom:8px}
.bar-lbl{font-family:var(--font-m);font-size:11px;text-align:right;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:20px;background:var(--surface2);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .8s cubic-bezier(.4,0,.2,1)}
.bar-val{font-family:var(--font-m);font-size:11px;color:var(--muted);text-align:right}

.wk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.wk{background:var(--surface2);padding:14px 12px;border-left:3px solid var(--accent2)}
.wk-n{font-family:var(--font-d);font-size:26px;color:var(--muted);line-height:1}
.wk-v{font-family:var(--font-m);font-size:13px;color:var(--text);margin-top:5px}

.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:8px;font-family:var(--font-m);font-size:11px;margin-bottom:8px}
.ldot{width:9px;height:9px;border-radius:2px;flex-shrink:0}

.tbl-wrap{overflow-x:auto;max-height:340px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-family:var(--font-m);font-size:12px}
thead{position:sticky;top:0;background:var(--surface);z-index:2}
th{text-align:left;padding:10px 12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-size:10px;border-bottom:1px solid var(--border)}
td{padding:8px 12px;border-bottom:1px solid rgba(42,45,53,.5)}
tr:hover td{background:var(--surface2)}
.tg{color:var(--green)}.tr{color:var(--red)}.tm{color:var(--muted)}

.filter-bar{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.fbtn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:5px 12px;font-family:var(--font-m);font-size:11px;cursor:pointer;transition:.15s;letter-spacing:.06em}
.fbtn:hover,.fbtn.active{background:var(--accent);border-color:var(--accent);color:#000}

.conta-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.conta-c{background:var(--surface2);padding:14px 16px;border-bottom:2px solid var(--accent)}
.conta-c:last-child{border-bottom-color:var(--blue)}
.conta-n{font-family:var(--font-d);font-size:18px;color:var(--accent)}
.conta-c:last-child .conta-n{color:var(--blue)}
.conta-v{font-family:var(--font-m);font-size:18px;color:var(--text);margin-top:4px}

.prog-saldo{margin-top:16px}
.prog-lbl{display:flex;justify-content:space-between;font-family:var(--font-m);font-size:11px;color:var(--muted);margin-bottom:5px}
.prog-tk{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.prog-fk{height:100%;background:linear-gradient(90deg,var(--green),var(--accent));transition:width 1s}

.toast{position:fixed;bottom:28px;right:28px;background:var(--green);color:#000;padding:12px 22px;font-family:var(--font-m);font-size:12px;font-weight:500;transform:translateY(80px);opacity:0;transition:.3s;z-index:999;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.toast.show{transform:translateY(0);opacity:1}

.loading-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:20px}
.loading-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-spinner.hidden{display:none}
.loading-screen.hidden{display:none}
.loading-text{font-family:var(--font-m);font-size:13px;color:var(--muted);letter-spacing:.08em}

footer{text-align:center;padding:18px;font-family:var(--font-m);font-size:10px;color:var(--muted);border-top:1px solid var(--border)}
.no-data{display:flex;align-items:center;justify-content:center;height:120px;color:var(--muted);font-family:var(--font-m);font-size:12px;flex-direction:column;gap:8px}

@media(max-width:900px){
  .grid2{grid-template-columns:1fr}
  .panel.span2{grid-column:span 1}
  header{padding:20px}
  .kpi-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="loading-screen" id="loadingScreen">
  <div class="loading-spinner"></div>
  <div class="loading-text">Carregando dados...</div>
</div>

<header>
  <div>
    <div class="eyebrow">Controle Financeiro · Construção</div>
    <h1>PORTAL DA TRANSPARÊNCIA — OBRA</h1>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
    <button class="btn-upload" onclick="fetchSheets()">↻ Atualizar Agora</button>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="sync-dot" style="width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block"></span>
      <span id="sync-status" style="font-family:var(--font-m);font-size:11px;color:var(--muted)">Conectando ao Google Sheets...</span>
    </div>
    <div style="font-family:var(--font-m);font-size:10px;color:var(--muted)">Sincronização automática a cada 60s</div>
  </div>
</header>

<div class="kpi-grid">
  <div class="kpi">
    <div class="kpi-lbl">Total Arrecadado</div>
    <div class="kpi-val y" id="kEntrada">—</div>
    <div class="kpi-sub">Depósitos + Juros</div>
    <div class="kpi-ico">📥</div>
  </div>
  <div class="kpi red">
    <div class="kpi-lbl">Total Gasto</div>
    <div class="kpi-val r" id="kSaida">—</div>
    <div class="kpi-sub" id="kSaidaSub">Materiais + M.O.</div>
    <div class="kpi-ico">📤</div>
  </div>
  <div class="kpi green">
    <div class="kpi-lbl">Saldo Disponível</div>
    <div class="kpi-val g" id="kSaldo">—</div>
    <div class="kpi-sub" id="kPct">—% do fundo disponível</div>
    <div class="kpi-ico">💰</div>
  </div>
  <div class="kpi blue">
    <div
